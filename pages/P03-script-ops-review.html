<div class="modal-mask" id="editModal" hidden data-state-id="P03-S02"><section class="modal"><header class="head"><h2>修改</h2><button class="x" id="close">×</button></header><div class="form"><div class="form-grid"><div class="form-row"><label class="required">脚本标题</label><input class="control" value="心血管诊疗（G）/一种降压药不够时，什么时候需要联合用药？"></div><div class="form-row"><label class="required">选择分类</label><select class="control"><option>内科 / 心血管内科</option></select></div><div class="form-row"><label class="required">所属组</label><select class="control"><option>运营组</option></select></div><div class="form-row"><label>推荐医生</label><input class="control" value="陈冬 17763106042"></div><div class="form-row"><label class="required">是否显示</label><select class="control"><option>隐藏</option><option>显示</option></select></div><div class="form-row" data-change-id="P03-C01"><label class="required">运营是否审核</label><select class="control" id="reviewSelect"><option value="是">是</option><option value="否">否</option></select></div><div class="form-row content-row"><label class="required">脚本内容</label><textarea class="control">很多高血压朋友会问：“医生，我吃一种药好几年了，最近血压又高了，是不是该加药了？” 今天咱们就聊聊，什么情况下需要联合用药，以及为什么有时候两种药一起吃，反而比一种药加量更好。先给结论：当单用一种降压药在常规剂量下，血压仍然不能达标时，就需要考虑联合用药。一般来说，血压轻度升高、心血管风险不高的患者，可以先从一种药开始。为什么联合用药更科学？第一，降压效果更强。不同种类的降压药作用机制不同，联合使用能多靶点降压，起到“1+1大于2”的效果。第二，副作用更少。很多人以为药吃多了副作用更大，其实恰恰相反。第三，保护作用更全面。联合用药常常能同时覆盖心、脑、肾多个器官的保护需求。那具体怎么联合？医生会根据您的血压水平、年龄、有没有肾病或糖尿病来搭配。最后提醒：联合用药必须在医生指导下进行，不能自己随便加药。</textarea></div></div></div><footer class="modal-foot"><button class="btn cancel" id="cancel">取消</button><button class="btn" id="confirm">确定</button></footer></section></div><div class="download" id="download">导入模板已生成：新增列「运营是否审核」</div><div class="toast" id="toast"></div>

e=>{const m=e.data||{};if(m.type==='prototype:scenario')apply(m.scenarioId);if(m.type==='prototype:reset')apply('P03-S01');if(m.type==='prototype:set-mode')root.dataset.mode=m.mode||'prototype';if(m.type==='prototype:highlight'){const el=document.querySelector(`[data-change-id="${m.changeId}"]`);if(el){el.classList.add('highlight');el.scrollIntoView({block:'center'});setTimeout(()=>el.classList.remove('highlight'),1300);parent!==window&&parent.postMessage({type:'prototype:highlight-result',pageId:'P03',changeId:m.changeId,success:true},'*')}}});apply(new URLSearchParams(location.search).get('prototypeScenario')||'P03-S01');parent!==window&&parent.postMessage({type:'prototype:page-ready',pageId:'P03',scenarioId:root.dataset.stateId},'*')})();</script></body></html>
