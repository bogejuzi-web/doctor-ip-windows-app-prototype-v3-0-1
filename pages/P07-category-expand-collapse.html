<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="icon" href="data:,"><title>脚本分类</title><style>body{margin:0;min-width:1200px;font:14px Microsoft YaHei;color:#40536b}.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}.side{background:#29435e;color:#dbe6f1}.nav{padding:20px;height:62px}.active{background:#36516d}.child{padding:14px 0 14px 44px}.child.active{background:#1f354a;color:#55b7ff}.top{padding:18px;border-bottom:1px solid #edf0f3}.page{padding:20px}.input{width:400px;height:42px;border:1px solid #dce3ec;border-radius:4px;padding:0 15px}.btn{background:#4198f3;color:#fff;border:0;border-radius:3px;padding:10px 20px;margin-left:10px;font-weight:700}.table{width:100%;border-collapse:collapse;margin-top:22px;text-align:center}.table th,.table td{border:1px solid #e5eaf1;padding:13px}.table th{color:#8998ab}.parent{cursor:pointer}.child-row td:first-child{padding-left:95px;text-align:left}.hidden{display:none}.toast{position:fixed;top:20px;left:50%;padding:10px 15px;border-radius:4px;background:#293f59;color:#fff;opacity:0;transition:.2s}.toast.show{opacity:1}</style></head><body><div class="app" data-page-root data-state-id="P07-S01"><aside class="side"><div class="nav">♟　首页</div><div class="nav">▥　数据统计　⌄</div><div class="nav">✂　视频剪辑　⌄</div><div class="nav">♟　医生管理　⌄</div><div class="nav active">☷　脚本管理　⌃</div><div class="child">脚本列表</div><div class="child active">脚本分类</div></aside><main><header class="top">☰　首页　/　脚本管理　/　脚本分类</header><section class="page"><input class="input" placeholder="请输入分类名称查询"><button class="btn">查询</button><button class="btn">重置</button><button class="btn" id="expand" data-change-id="P07-C01">一键展开分类</button><button class="btn" id="collapse" data-change-id="P07-C02">一键收起分类</button><button class="btn" style="float:right">添加一级分类</button><table class="table"><thead><tr><th>级别</th><th>ID</th><th>名称</th><th>创建时间</th><th>排序</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></section></main></div><div class="toast" id="toast"></div><script>(()=>{const groups=[['157','诺和诺德',[['161','糖尿病相关'],['162','糖尿病减重相关']]],['158','北京春播',[['159','中医贴敷'],['160','春日孩童成长']]],['141','医路领航',[['142','呼吸系统肿瘤'],['143','消化系统肿瘤'],['144','女性生殖系统肿瘤'],['145','泌尿系统肿瘤'],['146','乳腺癌']]]];const rows=document.querySelector('#rows'),toast=document.querySelector('#toast');let open=true;const render=()=>rows.innerHTML=groups.map((g,i)=>`<tr class="parent" data-g="${i}"><td>⌄　一级</td><td>${g[0]}</td><td>${g[1]}</td><td>2026-03-13 17:10:56</td><td><input value="${i}"></td><td><button class="btn">添加子级</button><button class="btn">编辑</button></td></tr>${g[2].map((x,j)=>`<tr class="child-row group-${i} ${open?'':'hidden'}"><td>二级</td><td>${x[0]}</td><td>${x[1]}</td><td>2026-03-13 17:11:51</td><td><input value="${j+1}"></td><td><button class="btn">添加子级</button><button class="btn">编辑</button><button class="btn">删除</button></td></tr>`).join('')}`).join('');render();const note=x=>{toast.textContent=x;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1300)};expand.onclick=()=>{open=true;render();note('已一键展开全部分类')};collapse.onclick=()=>{open=false;render();note('已一键收起全部分类')};document.addEventListener('click',e=>{const p=e.target.closest('.parent');if(p){document.querySelectorAll('.group-'+p.dataset.g).forEach(x=>x.classList.toggle('hidden'))}});window.addEventListener('message',e=>{const m=e.data||{};if(m.type==='prototype:reset')collapse.click();if(m.type==='prototype:highlight'){const x=document.querySelector(`[data-change-id="${m.changeId}"]`);x&&x.focus()}});parent!==window&&parent.postMessage({type:'prototype:page-ready',pageId:'P07',scenarioId:'P07-S01'},'*')})();</script></body></html>
<!-- prototypeScenario 默认加载 P07-S01 -->
<style>#expand{display:none!important}</style>
<script>document.addEventListener('DOMContentLoaded',()=>{const toggle=document.querySelector('#collapse');if(!toggle)return;document.querySelectorAll('.child-row').forEach(x=>x.classList.add('hidden'));let opened=false;toggle.textContent='全部展开';toggle.onclick=()=>{document.querySelectorAll('.child-row').forEach(x=>x.classList.toggle('hidden',opened));opened=!opened;toggle.textContent=opened?'全部收起':'全部展开'};});</script>
