<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>剪辑列表｜补充素材原因</title><style>*{box-sizing:border-box}body{margin:0;min-width:1550px;font:14px/1.45 "Microsoft YaHei";color:#536477}.app{display:grid;grid-template-columns:185px 1fr;min-height:100vh}.side{background:#29435e;color:#dbe6f1}.nav{height:50px;padding:15px 16px}.nav.active{background:#36516d}.child{padding:14px 0 0 34px}.child.active{padding-bottom:14px;background:#1f354a;color:#53b4ff}.main{padding:0 17px}.top{height:46px;border-bottom:1px solid #eef1f4;padding:13px 0;color:#26384d}.filters{display:flex;gap:12px;align-items:center;padding:16px 0 20px}.input{height:36px;width:175px;padding:0 12px;border:1px solid #dde4ec;border-radius:3px;color:#aab5c3}.input.wide{width:250px}.btn{height:30px;padding:0 13px;border:0;border-radius:3px;color:#fff;background:#4198f3;font-weight:700}.actions{display:flex;justify-content:flex-end;gap:12px}.tabs{display:flex;gap:25px;align-items:center;height:66px;color:#111;font-size:16px;font-weight:700}.tabs .sub{align-self:flex-end;margin:0 0 10px -12px;padding-bottom:7px;border-bottom:2px solid #4aa2f5}.table{width:100%;border-collapse:collapse;table-layout:fixed;text-align:center}.table th,.table td{border:1px solid #edf0f4}.table th{height:43px;color:#8f9bad}.table td{height:92px;padding:8px 6px}.link{color:#318bfa;line-height:1.65}.reason{display:block;overflow:hidden;max-height:42px;text-align:left;line-height:1.55;white-space:nowrap;text-overflow:ellipsis;cursor:help}.reason span{display:block;overflow:hidden;text-overflow:ellipsis}.pill{display:inline-block;padding:3px 9px;border-radius:3px;color:#fff;background:#ff7440}.view{background:#4aa2f5}.tip{position:fixed;z-index:5;display:none;max-width:360px;padding:11px 13px;border-radius:4px;color:#fff;background:#26384c;box-shadow:0 5px 15px #0003;line-height:1.75}.tip.show{display:block}.toast{position:fixed;top:20px;left:50%;padding:9px 15px;border-radius:4px;color:#fff;background:#26384c;opacity:0;transition:.2s}.toast.show{opacity:1}.highlight{outline:3px solid #efb646;outline-offset:3px}</style></head><body><div class="app" data-page-root data-state-id="P05-S01"><aside class="side"><div class="nav">♟　首页</div><div class="nav">▥　数据统计　⌄</div><div class="nav">▣　待办事项　⌄</div><div class="nav">▤　合同管理　⌄</div><div class="nav active">✂　视频剪辑　⌃</div><div class="child">成片列表</div><div class="child active">剪辑列表</div><div class="nav">♟　医生管理　⌄</div><div class="nav">☷　脚本管理　⌄</div><div class="child">脚本列表</div><div class="child">脚本分类</div><div class="nav">♧　权限管理　⌄</div><div class="nav">▣　设置　⌄</div></aside><main class="main"><header class="top">☰　首页　/　视频剪辑　/　剪辑列表</header><section class="filters"><b>关联运营</b><select class="input"><option>运营组 / 魏志远</option></select><b>当前处理人</b><select class="input"><option>全部</option></select><b>创建时间</b><input class="input" placeholder="▣　开始日期　-　结束日期"><b>成片交付时间</b><input class="input wide" placeholder="◷　开始时间　-　结束时间"><b>医生类型</b><select class="input" style="width:90px"><option>0</option></select><b>是否确认成片</b><select class="input" style="width:100px"><option>全部</option></select><b>视频标签</b><select class="input" style="width:100px"><option>0</option></select></section><section class="filters" style="padding-top:0"><input class="input wide" placeholder="请输入姓名、联系方式或视频标题"><button class="btn" id="search">查询</button><button class="btn" id="reset">重置</button></section><div class="actions"><button class="btn">导出打款状态模板</button><button class="btn">导入打款状态</button><button class="btn">导出</button><button class="btn">新增任务⌄</button></div><div class="tabs"><span>全部</span><span>原片审核</span><span>文案校对</span><span>文案优化</span><span>剪辑中</span><span>成片审核</span><span>成片交付</span><span>成片修改</span><span>已完成</span><span>已取消</span><span>AI剪辑</span><span class="sub">待补充素材</span></div><table class="table"><thead><tr><th>ID</th><th style="width:29%">视频标题</th><th>脚本列表</th><th>医生姓名</th><th>联系方式</th><th>关联运营</th><th>当前状态</th><th>子状态</th><th>当前处理人</th><th>创建时间</th><th>视频标签</th><th>是否确认成片</th><th data-change-id="P05-C01" style="width:155px">补充素材原因</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></main></div><div class="tip" id="tip"></div><div class="toast" id="toast"></div><script>(()=>{const rows=document.querySelector('#rows'),tip=document.querySelector('#tip'),toast=document.querySelector('#toast'),root=document.querySelector('[data-page-root]');const data=[['18045','乳糖不耐受怎么解决？','4313 胃癌是绝症吗？教你认识胃癌','阳钊','18825148356','魏志远','原片审核','待补充素材','陈华琼（已离职）','2023-02-18 18:28:16','免费医生','未确认','1. 原片口播音量较低，需要补充清晰版本\n2. 缺少术后注意事项说明，需要补充对应素材'],['19272','胆囊结石','4697 熬夜是脑出血的诱因吗','阳钊','18825148356','魏志远','原片审核','待补充素材','李冉（已离职）','2023-03-09 23:00:00','免费医生','未确认','1. 医生未按脚本完成关键用药提示，需要补拍\n2. 背景噪声过大，需重新录制'],['20653','如何应对春季过敏','5124 化痰利湿，冰蟾西瓜能多吃吗？','阳钊','18825148356','魏志远','原片审核','待补充素材','李冉（已离职）','2023-04-13 21:35:22','免费医生','未确认','1. 补充用药注意事项'],['20654','什么是巧克力囊肿','5124 化热利湿，冰蟾西瓜能多吃吗？','阳钊','18825148356','魏志远','原片审核','待补充素材','李冉（已离职）','2023-04-13 21:39:09','免费医生','未确认','1. 缺少医生姓名条画面\n2. 结尾未引导关注，需补充收尾镜头']];rows.innerHTML=data.map(r=>`<tr>${r.slice(0,12).map((x,i)=>`<td class="${i===1||i===2?'link':''}">${x}</td>`).join('')}<td><div class="reason" title="${r[12].replace(/\n/g,' &#10;')}" data-full="${r[12].replace(/\n/g,'|')}">${r[12].split('\n').map(x=>`<span>${x}</span>`).join('')}</div></td><td><span class="pill">分配</span>　<span class="pill view">查看</span></td></tr>`).join('');document.addEventListener('mouseover',e=>{const x=e.target.closest('.reason');if(!x)return;tip.textContent=x.dataset.full.replaceAll('|','\n');tip.style.left=Math.min(innerWidth-385,e.clientX+12)+'px';tip.style.top=e.clientY+12+'px';tip.classList.add('show')});document.addEventListener('mouseout',e=>{if(e.target.closest('.reason'))tip.classList.remove('show')});const note=x=>{toast.textContent=x;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1500)};search.onclick=()=>note('已按当前条件查询');reset.onclick=()=>note('筛选条件已重置');window.addEventListener('message',e=>{const m=e.data||{};if(m.type==='prototype:scenario'||m.type==='prototype:reset')root.dataset.stateId=m.scenarioId||'P05-S01';if(m.type==='prototype:highlight'){const x=document.querySelector(`[data-change-id="${m.changeId}"]`);if(x){x.classList.add('highlight');setTimeout(()=>x.classList.remove('highlight'),1300)}}});parent!==window&&parent.postMessage({type:'prototype:page-ready',pageId:'P05',scenarioId:'P05-S01'},'*')})();</script></body></html>
